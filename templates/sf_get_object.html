<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title | e }}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        font-size: 13px;
        margin: 10px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th, td {
        border: 1px solid #ccc;
        padding: 6px 10px;
        text-align: left;
      }
      th {
        background: #f0f0f0;
      }
      .no-results {
        color: #888;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="sf-get-object">
      {% if not rows %}
        <p class="no-results">No results available.</p>
      {% else %}
        {% for row in rows %}
          <table>
            <thead>
              <tr>
                {% for col in row.keys() %}<th>{{ col | e }}</th>{% endfor %}
              </tr>
            </thead>
            <tbody>
              <tr>
                {% for val in row.values() %}<td>{{ val | e }}</td>{% endfor %}
              </tr>
            </tbody>
          </table>
        {% endfor %}
      {% endif %}
    </div>
  </body>
</html>
