<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title | e }}</title>
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        font-size: 13px;
        margin: 10px;
      }
      table.dataTable {
        width: 100% !important;
      }
      table.dataTable td,
      table.dataTable th {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 300px;
      }
      .no-results {
        color: #888;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="sf-run-query">
      {% if not rows %}
        <p class="no-results">No results available.</p>
      {% else %}
        <table id="sf-run-query-table" class="display" style="width: 100%">
          <thead>
            <tr>
              {% for col in rows[0].keys() %}<th>{{ col | e }}</th>{% endfor %}
            </tr>
          </thead>
          <tbody>
            {% for row in rows %}
              <tr>
                {% for val in row.values() %}<td>{{ val | e }}</td>{% endfor %}
              </tr>
            {% endfor %}
          </tbody>
        </table>
      {% endif %}
    </div>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script>
      $(document).ready(function () {
        {% if rows %}$('#sf-run-query-table').DataTable({ scrollX: true, pageLength: 25 });{% endif %}
      });
    </script>
  </body>
</html>
